# Öffentliches Repo: keine Secrets, keine bekannten unsicheren Muster.
# GitHub Secret Scanning + Push Protection sind zusätzlich eingeschaltet.
name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (gesamte Historie)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner --exit-code 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Semgrep
        run: |
          pip install --quiet semgrep==1.183.0
          semgrep scan --metrics=off --quiet --error \
            --config p/php --config p/javascript --config p/owasp-top-ten --config p/secrets
